<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solara AI Embed Demo</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(160deg, #f7f3ea, #efe7d8 45%, #e7f0f2);
        color: #1c1917;
        min-height: 100vh;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }
      h1 {
        font-weight: 500;
        letter-spacing: -0.03em;
        margin-bottom: 8px;
      }
      p {
        color: #57534e;
        line-height: 1.5;
      }
      .widget {
        margin-top: 28px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 18px 50px rgba(28, 25, 23, 0.12);
        background: white;
      }
      iframe {
        display: block;
        width: 100%;
        max-width: 400px;
        height: 140px;
        border: 0;
      }
      code {
        font-size: 13px;
        background: rgba(28, 25, 23, 0.06);
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bella Salon website mock</h1>
      <p>
        This page hosts the Solara AI call widget in an iframe. Replace the slug in
        <code>embed-demo.html</code> if needed. Default slug:
        <code>bella-receptionist-en</code>.
      </p>
      <div class="widget">
        <iframe
          src="/embed/bella-receptionist-en"
          title="Solara AI call widget"
          allow="microphone"
          width="400"
          height="140"
        ></iframe>
      </div>
    </main>
  </body>
</html>
